# Minimal Mosquitto config for W3 · S20 (local acceptance).
# Start:  mosquitto.exe -c mosquitto.conf -v
# Then:   run.bat

# Note 21 uses `listener 1883 0.0.0.0`; loopback is enough for this check and
# keeps an anonymous broker off the LAN.
listener 1883 127.0.0.1
allow_anonymous true

# Verbose log makes protocol errors / disconnects visible while running
# the negative cases.
log_type all
log_dest stdout